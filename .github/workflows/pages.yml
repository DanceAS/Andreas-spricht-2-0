name: Website-Vorschau auf GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Repository laden
        uses: actions/checkout@v4
      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5
      - name: Ausschließlich Website-Dateien vorbereiten
        run: |
          mkdir -p _site
          cp index.html styles.css content.js app.js _site/
          if [ -d assets ]; then
            mkdir -p _site/assets
            cp -R assets/. _site/assets/
          fi
          mkdir -p _site/bordeaux
          cp bordeaux/index.html bordeaux/styles.css bordeaux/hero-image-v2.css bordeaux/studio-content.js bordeaux/sample-content.js _site/bordeaux/
          cp content.js app.js _site/bordeaux/
          if [ -d assets ]; then
            mkdir -p _site/bordeaux/assets
            cp -R assets/. _site/bordeaux/assets/
          fi
          if [ -d bordeaux/assets ]; then
            mkdir -p _site/bordeaux/assets
            cp -R bordeaux/assets/. _site/bordeaux/assets/
          fi
          touch _site/.nojekyll
      - name: Vorschau hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Vorschau veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
